on:
  push:
    tags:
      - 'v*'        # standard: v0.1.5
      - '*'         # ALSO support legacy tags like 0.1.5

build:
  runs-on: ubuntu-latest
  permissions:
    contents: read
    packages: write
    id-token: write

  concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.19'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v2
      with:
        version: latest
        args: release --rm-dist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
